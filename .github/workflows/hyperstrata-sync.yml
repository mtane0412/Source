# Hyperstrata の引用ネットワーク(References / Cited By)を成立させるため、
# 公開済み記事の本文リンクから引用タグ(#ref-<slug>)を自動付与するワークフロー。
# 処理内容は scripts/hyperstrata-sync.mjs を参照。
#
# Ghost の Webhook は任意ヘッダーを付けられず GitHub の repository_dispatch を直接叩けないため、
# 定期実行(cron)と手動実行(workflow_dispatch)で同期する。
#
# 事前準備: deploy-theme.yml と同じ Secrets(GHOST_ADMIN_API_URL / GHOST_ADMIN_API_KEY)を使う。
name: Hyperstrata Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '更新せずに差分だけ表示する'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync citation tags
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*

      - name: Sync citation tags via Ghost Admin API
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/hyperstrata-sync.mjs $([ "$DRY_RUN" = "true" ] && echo --dry-run)
